<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Outer border -->
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#1a1a6e" stroke-width="16"/>

  <!-- Sun / solar symbol -->
  <circle cx="256" cy="180" r="60" fill="none" stroke="#1a1a6e" stroke-width="16"/>
  <!-- Sun rays -->
  <line x1="256" y1="80"  x2="256" y2="56"  stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="256" y1="304" x2="256" y2="280" stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="156" y1="180" x2="132" y2="180" stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="380" y1="180" x2="356" y2="180" stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="185" y1="109" x2="168" y2="92"  stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="344" y1="268" x2="327" y2="251" stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="327" y1="109" x2="344" y2="92"  stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>
  <line x1="168" y1="268" x2="185" y2="251" stroke="#1a1a6e" stroke-width="12" stroke-linecap="square"/>

  <!-- Battery block -->
  <rect x="120" y="340" width="272" height="120" fill="none" stroke="#1a1a6e" stroke-width="14"/>
  <!-- Battery terminal -->
  <rect x="224" y="322" width="64" height="20" fill="#1a1a6e"/>
  <!-- Battery fill ~75% -->
  <rect x="134" y="354" width="152" height="92" fill="#1a1a6e"/>

  <!-- Lightning bolt (energy) -->
  <polygon points="270,356 242,400 262,400 238,444 280,392 258,392 282,356" fill="#ffffff"/>
</svg>
