<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%238b5cf6'/%3E%3Ctext x='90' y='120' text-anchor='middle' fill='white' font-size='100' font-weight='bold' font-family='system-ui'%3EH%3C/text%3E%3C/svg%3E">
  <title>Hermes Chat</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --surface2: #1e1e2e;
      --primary: #8b5cf6;
      --primary-dim: #6d28d9;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #06b6d4;
      --green: #22c55e;
      --red: #ef4444;
      --radius: 12px;
      --max-w: 640px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--surface);
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      -webkit-user-select: none;
      user-select: none;
    }
    header h1 {
      font-size: 17px;
      font-weight: 600;
    }
    header .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      transition: background 0.3s;
    }
    .status-dot.offline { background: var(--red); }
    .status-dot.checking { background: #f59e0b; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.45; font-size: 15px; }
    .msg.user { background: var(--primary); align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.assistant { background: var(--surface2); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.system { background: transparent; align-self: center; font-size: 12px; color: var(--text-dim); }
    .msg .time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .thinking-dots { display: flex; gap: 4px; padding: 8px; align-items: center; }
    .thinking-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
    #input-area {
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    #input-area .settings-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 0 0 10px 0;
      opacity: 0.6;
      line-height: 1;
    }
    #input-area textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      outline: none;
    }
    #input-area textarea:focus { border-color: var(--primary); }
    #send-btn {
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #send-btn:disabled { opacity: 0.4; }
    #send-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .settings-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }
    .modal h2 { margin-bottom: 16px; font-size: 18px; }
    .modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
    .modal input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: 'SF Mono', ui-monospace, monospace;
      outline: none;
    }
    .modal input:focus { border-color: var(--primary); }
    .modal .actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal .actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .modal .actions .save { background: var(--primary); color: white; }
    .modal .actions .cancel { background: var(--surface2); color: var(--text); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Hermes</h1>
      <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">connecting</span></div>
    </div>
  </header>
  <div id="messages">
    <div class="msg system">Enter your tunnel URL and API key in Settings, then start chatting.</div>
  </div>
  <div id="input-area">
      <button class="settings-btn" id="settingsBtn">&#x2699;</button>
      <textarea id="msgInput" placeholder="Message..." rows="1" disabled></textarea>
    <button id="send-btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal">
      <h2>Settings</h2>
      <label>Tunnel URL</label>
      <input type="url" id="tunnelUrl" placeholder="https://xxx.trycloudflare.com">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="API_SERVER_KEY">
      <label>Model (optional)</label>
      <input type="text" id="modelName" placeholder="deepseek/deepseek-v4-flash">
      <div class="actions">
        <button class="cancel" id="cancelSettings">Cancel</button>
        <button class="save" id="saveSettings">Save</button>
      </div>
    </div>
  </div>
  <script>
    const TYPES = { user: 'user', assistant: 'assistant', system: 'system' };
    const settings = { tunnelUrl: '', apiKey: '', model: '' };
    let sending = false;
    const el = id => document.getElementById(id);
    const msgContainer = el('messages');
    const msgInput = el('msgInput');
    const sendBtn = el('send-btn');
    const statusDot = el('statusDot');
    const statusText = el('statusText');

    function loadSettings() {
      settings.tunnelUrl = localStorage.getItem('hermes_tunnel_url') || '';
      settings.apiKey = localStorage.getItem('hermes_api_key') || '';
      settings.model = localStorage.getItem('hermes_model') || 'deepseek/deepseek-v4-flash';
    }

    function saveSettings() {
      localStorage.setItem('hermes_tunnel_url', settings.tunnelUrl);
      localStorage.setItem('hermes_api_key', settings.apiKey);
      localStorage.setItem('hermes_model', settings.model);
    }

    function addMsg(type, content) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = content;
      if (type !== 'system') {
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.appendChild(time);
      }
      msgContainer.appendChild(div);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function setStatus(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    async function testConnection() {
      if (!settings.tunnelUrl || !settings.apiKey) {
        setStatus('offline', 'configure');
        return false;
      }
      setStatus('checking', 'testing...');
      try {
        const url = settings.tunnelUrl.replace(/\/+$/, '') + '/v1/chat/completions';
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey },
          body: JSON.stringify({ messages: [{ role: 'user', content: 'ping' }] })
        });
        if (resp.ok) { setStatus('', 'connected'); return true; }
        else { setStatus('offline', 'auth error'); return false; }
      } catch(e) {
        setStatus('offline', 'unreachable');
        return false;
      }
    }

    async function sendMessage(text) {
      if (sending || !text.trim()) return;
      sending = true;
      sendBtn.disabled = true;
      addMsg(TYPES.user, text.trim());
      msgInput.value = '';
      msgInput.style.height = 'auto';

      // show thinking dots
      const dots = document.createElement('div');
      dots.className = 'msg assistant';
      dots.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
      dots.id = 'thinking';
      msgContainer.appendChild(dots);
      msgContainer.scrollTop = msgContainer.scrollHeight;

      try {
        const url = settings.tunnelUrl.replace(/\/+$/, '') + '/v1/chat/completions';
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey },
          body: JSON.stringify({ messages: [{ role: 'user', content: text.trim() }] })
        });
        const data = await resp.json();
        document.getElementById('thinking')?.remove();
        if (resp.ok && data.choices?.[0]?.message?.content) {
          addMsg(TYPES.assistant, data.choices[0].message.content);
        } else {
          addMsg(TYPES.system, 'Error: ' + (data.error?.message || resp.status));
        }
      } catch(e) {
        document.getElementById('thinking')?.remove();
        addMsg(TYPES.system, 'Connection error. Check settings.');
      }
      sending = false;
      sendBtn.disabled = false;
      msgInput.focus();
    }

    // --- UI Events ---
    loadSettings();
    el('tunnelUrl').value = settings.tunnelUrl;
    el('apiKey').value = settings.apiKey;
    el('modelName').value = settings.model || 'deepseek/deepseek-v4-flash';

    el('settingsBtn').onclick = () => {
      el('tunnelUrl').value = settings.tunnelUrl;
      el('apiKey').value = settings.apiKey;
      el('modelName').value = settings.model || 'deepseek/deepseek-v4-flash';
      el('settingsOverlay').classList.add('open');
    };
    el('cancelSettings').onclick = () => el('settingsOverlay').classList.remove('open');
    el('saveSettings').onclick = () => {
      settings.tunnelUrl = el('tunnelUrl').value.trim();
      settings.apiKey = el('apiKey').value.trim();
      settings.model = el('modelName').value.trim() || 'deepseek/deepseek-v4-flash';
      saveSettings();
      el('settingsOverlay').classList.remove('open');
      const enabled = settings.tunnelUrl && settings.apiKey;
      msgInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
      if (enabled) { testConnection(); addMsg(TYPES.system, 'Settings saved. Connection test started.'); }
    };

    sendBtn.onclick = () => sendMessage(msgInput.value);
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(msgInput.value); }
    });
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    });

    // Initial connection test if settings exist
    if (settings.tunnelUrl && settings.apiKey) {
      msgInput.disabled = false;
      sendBtn.disabled = false;
      testConnection();
    }

    // iOS keyboard handling — keep input bar visible
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
      });
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
